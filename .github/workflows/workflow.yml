# Simple workflow for deploying static content to GitHub Pages
name: Build & Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - run: npm ci
      - name: Build tokens
        working-directory: ./packages/design-tokens
        run: npm ci && npm run build
      - name: Build core
        working-directory: ./packages/core
        run: npm ci && npm run build:js
      - name: Build storybook
        working-directory: ./packages/storybook
        run: npm ci && npm run build-storybook-ci
      - name: Build AI manifest (agentic)
        working-directory: ./packages/agentic
        run: npm run build
      - name: Publish AI artifacts alongside Storybook
        run: |
          mkdir -p packages/storybook/storybook-static/ai
          cp packages/agentic/dist/llms.txt packages/agentic/dist/llms-full.txt packages/storybook/storybook-static/
          cp packages/agentic/dist/manifest.json packages/agentic/dist/design-tokens.md packages/storybook/storybook-static/ai/
          cp -r packages/agentic/dist/components packages/storybook/storybook-static/ai/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./packages/storybook/storybook-static"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
